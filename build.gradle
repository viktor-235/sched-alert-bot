plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.palantir.git-version' version '5.1.0'
}

group = 'com.github.viktor235'
version = gitVersion()

bootJar {
    archiveFileName = "app.jar"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.compilerArgs += [
            '-Amapstruct.unmappedSourcePolicy=ERROR',
            '-Amapstruct.unmappedTargetPolicy=ERROR'
    ]
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation("cn.wanghaomiao:JsoupXpath:2.5.5")
    implementation group: 'org.jsoup', name: 'jsoup', version: '1.23.2'
    implementation group: 'org.javers', name: 'javers-core', version: '7.11.9'
    implementation 'org.freemarker:freemarker:2.3.35'
    implementation 'org.telegram:telegrambots-spring-boot-starter:6.9.7.1'
    implementation("org.apache.commons:commons-collections4:4.6.0")
    implementation 'org.mnode.ical4j:ical4j:4.4.0'
    // Annotations used by the patched ical4j ZoneRulesBuilder copy
    compileOnly 'org.jspecify:jspecify:1.0.1'

    // MongoDB
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation group: 'io.mongock', name: 'mongock-springboot', version: '5.5.1'
    implementation group: 'io.mongock', name: 'mongodb-springdata-v4-driver', version: '5.5.1'

    // Monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testImplementation 'org.testcontainers:mongodb:1.21.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Keep test runs out of the application log files in logs/
    systemProperty 'logging.file.name', ''
}
